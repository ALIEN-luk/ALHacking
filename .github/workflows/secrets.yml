name: Secret scan

# Enforcement of SECRETS_POLICY.md / SECRETS_POLICY.en.md:
#  * the test-suite encodes the policy clauses (masking, reveal gating, no leaks in reports),
#  * mask_secrets scans the working tree and uploads a masked SARIF report,
#  * gitleaks (optional job) scans the git history; rotate anything it finds -
#    a rewritten history does not un-reveal a secret.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly, in case new rules appear

permissions:
  contents: read

jobs:
  policy-tests:
    name: Policy test-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run mask_secrets tests
        run: python3 tools/secrets/tests/test_mask_secrets.py

  scan:
    name: Scan working tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan (blocking, masked output)
        run: |
          python3 tools/secrets/mask_secrets.py . --fail-on high --format text --lang pl | tee scan.txt
          {
            echo "## Raport skanowania sekretów (maskowany)"
            echo ""
            echo '```'
            cat scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build SARIF report (masked only)
        if: always()
        run: python3 tools/secrets/mask_secrets.py . --format sarif --out secrets.sarif --fail-on none

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secrets.sarif
          category: mask-secrets

      - name: Keep the masked report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-report
          path: |
            scan.txt
            secrets.sarif
          retention-days: 30

  history:
    name: Scan git history (gitleaks)
    runs-on: ubuntu-latest
    # Non-blocking on purpose: the action may require a licence on paid plans.
    # Read the result and act on it - never commit a secret because the job is yellow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
